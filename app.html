<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berkay Napıyor?</title>
<meta name="robots" content="noindex">
<!-- Eski adres: app.html?a=acaba → /acaba/ -->
<script>
var s = (new URLSearchParams(location.search).get('a') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
if (s === 'bize-ne-yapacak') s = 'acaba';
location.replace(s ? '/' + s + '/' : '/');
</script>
<noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body style="font-family:system-ui,sans-serif;background:#F4F1E9;color:#17191C;padding:24px">
<p><a href="/">Berkay Napıyor?</a></p>
</body>
</html>
